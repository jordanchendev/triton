[project]
name = "triton"
version = "0.1.0"
description = "GPU-accelerated media-to-text worker for OpenClaw"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "yt-dlp>=2024.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
gpu = [
    "faster-whisper>=1.0",
    "paddlepaddle-gpu>=2.6",
    "paddleocr>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort — import sorting
    "UP",   # pyupgrade — modernise syntax
    "B",    # bugbear — common bug patterns
    "SIM",  # simplify — unnecessary complexity
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # function-call-in-default-argument — FastAPI Depends()
    "RUF012", # mutable-class-default — SQLAlchemy / Pydantic
    "RUF001", # ambiguous-unicode-character-string — Chinese text is intentional
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.isort]
known-first-party = ["triton"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
