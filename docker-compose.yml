services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://triton:triton@host.docker.internal:5433/triton
      - REDIS_URL=redis://host.docker.internal:6379/0
      - UPLOAD_DIR=/data/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/tmp:/data/tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    command: celery -A triton.workers.celery_app worker -Q gpu -c 1 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://triton:triton@host.docker.internal:5433/triton
      - REDIS_URL=redis://host.docker.internal:6379/0
      - WHISPER_DEVICE=cuda
      - UPLOAD_DIR=/data/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/tmp:/data/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - api
    restart: unless-stopped

  cpu-worker:
    build:
      context: .
      args:
        INSTALL_ML: "true"
    command: celery -A triton.workers.celery_app worker -Q cpu -c 2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://triton:triton@host.docker.internal:5433/triton
      - REDIS_URL=redis://host.docker.internal:6379/0
      - UPLOAD_DIR=/data/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/tmp:/data/tmp
    depends_on:
      - api
    restart: unless-stopped

  cpu-ml-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    command: celery -A triton.workers.celery_app worker -Q cpu-ml -c 4 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://triton:triton@host.docker.internal:5433/triton
      - REDIS_URL=redis://host.docker.internal:6379/0
      - WHISPER_DEVICE=cpu
      - WHISPER_MODEL=large-v3
      - WHISPER_COMPUTE_TYPE=int8
      - UPLOAD_DIR=/data/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/tmp:/data/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - api
    restart: unless-stopped
