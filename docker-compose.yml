services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://triton:triton@postgres:5432/triton
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/data/tmp
    volumes:
      - /data/tmp:/data/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  gpu-worker:
    build:
      context: .
      args:
        INSTALL_ML: "true"
    command: celery -A triton.workers.celery_app worker -Q gpu -c 1 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://triton:triton@postgres:5432/triton
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_DEVICE=cuda
      - UPLOAD_DIR=/data/tmp
    volumes:
      - /data/tmp:/data/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  cpu-worker:
    build:
      context: .
      args:
        INSTALL_ML: "true"
    command: celery -A triton.workers.celery_app worker -Q cpu -c 2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://triton:triton@postgres:5432/triton
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/data/tmp
    volumes:
      - /data/tmp:/data/tmp
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - /data/redis:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triton
      POSTGRES_PASSWORD: triton
      POSTGRES_DB: triton
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triton"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
